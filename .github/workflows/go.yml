# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ['1.23']
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download modules
      run: go mod download

    - name: Format check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Go code is not formatted properly. Please run 'go fmt ./...':"
          gofmt -s -d .
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Lint with golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        args: --timeout=5m

    - name: Build
      run: go build -v ./...

    - name: Test (with race detector)
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Test (with coverage)
      run: go test -coverprofile=coverage.out -covermode=atomic ./...

    - name: Generate coverage report
      id: generate_coverage
      run: |
        if [ -f coverage.out ]; then
          go tool cover -html=coverage.out -o coverage.html
          echo "coverage_exists=true" >> $GITHUB_OUTPUT
        else
          echo "coverage_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload coverage.out artifact
      uses: actions/upload-artifact@v4
      if: always() && steps.generate_coverage.outputs.coverage_exists == 'true'
      with:
        name: coverage-out-go${{ matrix.go-version }}
        path: coverage.out
        retention-days: 1

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Archive coverage report (html)
      uses: actions/upload-artifact@v4
      if: always() && steps.generate_coverage.outputs.coverage_exists == 'true'
      with:
        name: coverage-report-go${{ matrix.go-version }}
        path: coverage.html
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
        cache: true

    - name: Run go mod tidy
      run: go mod tidy || true

    - name: Check for vulnerable dependencies (nancy)
      run: |
        set -e
        go install github.com/sonatype-nexus-community/nancy@latest
        go list -json -m all | nancy sleuth || true

    - name: Run gosec security scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail ./...'

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: mir-url-shortener:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  coverage-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Download coverage artifact
      uses: actions/download-artifact@v4
      with:
        name: coverage-out-go1.23
      continue-on-error: true

    - name: Check coverage threshold
      run: |
        if [ ! -f coverage.out ]; then
          echo "coverage.out not found, skipping coverage threshold check"
          exit 0
        fi
        coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | cut -d'%' -f1)
        threshold=50
        echo "Coverage: ${coverage}%"
        if (( $(echo "$coverage < $threshold" | bc -l) )); then
          echo "Coverage ${coverage}% is below threshold of ${threshold}%"
          exit 1
        fi
        echo "Coverage threshold check passed!"

